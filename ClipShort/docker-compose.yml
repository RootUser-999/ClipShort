services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      CLIP_STORAGE_DIR: /tmp/clipshort
      MAX_VIDEO_DURATION: ${MAX_VIDEO_DURATION:-43200}
      MAX_JOB_DURATION_MS: ${MAX_JOB_DURATION_MS:-300000}
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      INFO_RATE_LIMIT: ${INFO_RATE_LIMIT:-10}
      CLIP_RATE_LIMIT: ${CLIP_RATE_LIMIT:-5}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
      ALLOW_ONLY_CC_OR_OWN: ${ALLOW_ONLY_CC_OR_OWN:-false}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - clip-temp:/tmp/clipshort
      - ${HOST_YTDLP_COOKIES_FILE:-./empty-cookies.txt}:/run/secrets/youtube-cookies.txt:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_ALLOW_ONLY_CC_OR_OWN: ${ALLOW_ONLY_CC_OR_OWN:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis-data:
  clip-temp:
